[project]
name = "dva"
version = "0.1.0"
description = "Decision Value Attribution experiments for CAISO storage and EMS staging."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cmcrameri>=1.9",
    "geopandas>=1.1.3",
    "highspy>=1.14.0",
    "matplotlib>=3.10.8",
    "mypy>=1.20.1",
    "ortools>=9.15.6755",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pyepo>=1.1.1",
    "pyomo>=6.10.0",
    "pytest>=9.0.3",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "upsetplot>=0.9.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
gurobi = [
    "gurobipy>=13.0.1",
]

[project.scripts]
dva-caiso-gdsi = "dva.case_studies.caiso.runners.gdsi:main"
dva-caiso-joint-dvi = "dva.case_studies.caiso.runners.joint_dvi:main"
dva-ems-infodva = "dva.case_studies.ems.runners.infodva:main"
dva-ems-design-joint-dvi = "dva.case_studies.ems.runners.design_joint_dvi:main"
dva-ems-design-utility-dva = "dva.case_studies.ems.runners.design_utility:main"
dva-ems-compute-benchmark = "dva.case_studies.ems.runners.compute_benchmark:main"
dva-ems-kernel-permutation-benchmark = "dva.case_studies.ems.runners.kernel_permutation_benchmark:main"
dva-ems-baseline-experiment = "dva.analysis.run_ems_baseline_experiment:main"
dva-paired-bootstrap-ci = "dva.analysis.paired_bootstrap:main"
dva-additional-decision-ranking-baselines = "dva.analysis.additional_decision_ranking_baselines:main"
dva-validation-ranked-test-auc = "dva.analysis.validation_ranked_test_auc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
